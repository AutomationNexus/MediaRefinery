name: Nightly Build

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force a build even if dev already matches the last nightly (no scheduled builds -- this is the only manual fallback)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly:
    uses: automationnexus/.github/.github/workflows/nightly.yml@v1
    with:
      runner-labels: '["linux","x64","k3s","ubuntu-latest"]'
      image-name: automationnexus/mediarefinery
      platforms: linux/amd64
      force_run: ${{ inputs.force_run || false }}
      has-frontend: true
      spa-artifact-path: 'src/mediarefinery/web/'
      coverage-threshold: 90
